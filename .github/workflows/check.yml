name: Test and build Linux and Windows
on: [push, pull_request, workflow_dispatch]
env:
  CARGO_BUILD_JOBS: 2
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git -c core.longpaths=true submodule update --init --depth 1
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y musl-tools pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s scripts/tests
      - run: cargo build -p assistant-server --bin assistant-server --example provider-fixture --locked
      - run: ASSISTANT_TEST_PROVIDER="$PWD/target/debug/examples/provider-fixture" ASSISTANT_TEST_SERVER="$PWD/target/debug/assistant-server" cargo test -p assistant-server integration_ --locked -- --ignored
      - run: ./scripts/build_client.sh
      - run: cargo build --release --locked -p assistant-server
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/linux-assistant
            target/release/assistant-server
            vendor/codex/LICENSE
            vendor/codex/NOTICE
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git -c core.longpaths=true submodule update --init --depth 1
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s scripts/tests
      - run: cargo build -p assistant-server --bin assistant-server --example provider-fixture --locked
      - shell: pwsh
        run: |
          $env:ASSISTANT_TEST_PROVIDER="$PWD/target/debug/examples/provider-fixture.exe"
          $env:ASSISTANT_TEST_SERVER="$PWD/target/debug/assistant-server.exe"
          cargo test -p assistant-server integration_ --locked -- --ignored
      - run: cargo build -p linux-assistant --locked
      - shell: pwsh
        run: |
          $env:ASSISTANT_TEST_CLIENT="$PWD/target/debug/linux-assistant.exe"
          cargo test -p linux-assistant integration_launcher_ --locked -- --ignored
      - run: cargo build --release --locked --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/release/linux-assistant.exe
            target/release/assistant-server.exe
            vendor/codex/LICENSE
            vendor/codex/NOTICE

[workspace]
members = ["crates/protocol", "crates/client", "crates/server"]
exclude = ["vendor/codex"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
protocol = { path = "crates/protocol" }
codex-app-server = { path = "vendor/codex/codex-rs/app-server" }
codex-arg0 = { path = "vendor/codex/codex-rs/arg0" }
codex-config = { path = "vendor/codex/codex-rs/config" }
codex-utils-cli = { path = "vendor/codex/codex-rs/utils/cli" }

[workspace.metadata.codex]
release = "rust-v0.164.0"

# BEGIN CODEX PATCHES — generated by scripts/update_codex.py
[patch."crates-io"]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
# END CODEX PATCHES

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

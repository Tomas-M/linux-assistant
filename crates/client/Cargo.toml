[package]
name = "linux-assistant"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
fs2.workspace = true
protocol.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid.workspace = true
dirs = "6"
tempfile = "3"
webbrowser = "1"
libc = "0.2"
similar = "2.7"
toml = "1.0"
sha2.workspace = true
base64 = "0.22"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "webp", "png"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

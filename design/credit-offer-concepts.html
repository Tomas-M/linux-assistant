<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Slax Assistant · 10 free-credit designs</title>
    <style>
        :root { color-scheme:light; --bg:#f7f8f7; --paper:#fff; --ink:#242a27; --muted:#66716a; --line:#dfe6e1; --field:#7b8d81; --accent:#23764e; --soft:#edf5ef; --on-accent:#fff; --shadow:0 .5rem 2rem #182c2108; font:90%/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        :root[data-theme=dark] { color-scheme:dark; --bg:#151a17; --paper:#202722; --ink:#e7ede8; --muted:#a1ada5; --line:#3a473f; --field:#8c9c91; --accent:#8bc8a3; --soft:#283c2e; --on-accent:#14251a; --shadow:none; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--ink); }
        button,input { font:inherit; color:inherit; }
        button { cursor:pointer; }
        button:focus-visible,input:focus-visible { outline:.125rem solid var(--accent); outline-offset:.1875rem; }
        h1,h2,p { margin:0; }
        h1 { font-size:2.25rem; line-height:1.2; letter-spacing:-.0625rem; font-weight:650; }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:1.5rem; padding:1.25rem 2rem; border-bottom:.0625rem solid var(--line); background:var(--paper); }
        .brand { font-size:1.25rem; font-weight:600; }
        .tools { display:flex; align-items:center; gap:1rem; }
        .tools small { color:var(--muted); font-size:.8125rem; }
        .theme { display:grid; place-items:center; width:2.5rem; height:2.5rem; padding:0; border:.0625rem solid var(--line); border-radius:.625rem; background:var(--paper); }
        svg { width:1.25rem; height:1.375rem; fill:currentColor; }
        .definitions { position:absolute; width:0; height:0; overflow:hidden; }
        main { max-width:84rem; padding:2rem 2rem 3rem; margin:auto; }
        .intro { display:grid; gap:.75rem; margin-bottom:2rem; }
        .intro p { color:var(--muted); max-width:48rem; }
        .gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,23rem),1fr)); align-items:start; gap:2rem 1.5rem; }
        .choice h2 { display:flex; align-items:baseline; gap:.75rem; font-size:1rem; line-height:1.5; font-weight:600; margin-bottom:.75rem; }
        .choice h2 span { color:var(--muted); font-size:.8125rem; font-weight:400; font-variant-numeric:tabular-nums; }
        .sample { border:.0625rem solid var(--line); border-radius:1.25rem; padding:2rem; background:var(--paper); box-shadow:var(--shadow); }
        .caption { display:block; color:var(--muted); font-size:.8125rem; line-height:1.3; margin:0; }
        .label { display:block; font-size:1.25rem; line-height:1.2; font-weight:600; }
        .number { font-size:2.25rem; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; }
        .headline { font-size:1.5rem; line-height:1.25; font-weight:600; }
        .email-form { display:grid; gap:.75rem; margin-top:1.5rem; }
        .email-form input { width:100%; min-width:0; min-height:3.25rem; padding:.75rem 1rem; border:.0625rem solid var(--field); border-radius:.625rem; background:var(--paper); }
        .email-form button { min-height:3rem; border:.0625rem solid var(--ink); border-radius:.625rem; background:var(--ink); color:var(--paper); padding:.75rem 1rem; font-weight:600; }
        .email-form button:hover { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
        .v1 { border-left:.25rem solid var(--accent); padding:.25rem 0 .25rem 1rem; }
        .v1 .headline { color:var(--accent); }
        .v1 .caption { margin-top:.375rem; }
        .v2 { display:flex; align-items:center; gap:1rem; }
        .v2 .number { display:grid; place-items:center; width:4.5rem; height:4.5rem; flex-shrink:0; border-radius:1rem; background:var(--accent); color:var(--on-accent); }
        .v2 .caption { margin-top:.25rem; }
        .v3 { text-align:center; padding:.25rem 0; }
        .v3 .caption:first-child { margin-bottom:.375rem; }
        .v3 .headline { color:var(--accent); }
        .v3 .number { display:block; margin-bottom:.125rem; }
        .v3 .caption:last-child { margin-top:.375rem; }
        .v4 { display:flex; align-items:center; gap:1rem; border-radius:.875rem; padding:1rem 1.25rem; background:var(--accent); color:var(--on-accent); }
        .v4 .caption { color:inherit; opacity:.85; margin-top:.25rem; }
        .top-band { padding:0; overflow:hidden; }
        .v5 { display:flex; align-items:center; justify-content:center; gap:1rem; padding:1.25rem 2rem; background:var(--soft); color:var(--accent); border-bottom:.0625rem solid var(--line); }
        .v5 .caption { margin-top:.25rem; }
        .top-band .email-form { margin:0; padding:1.5rem 2rem 2rem; }
        .v6 { display:flex; align-items:center; gap:1rem; padding:1rem 1.25rem; border:.125rem dashed var(--accent); border-radius:.875rem; background:var(--soft); color:var(--accent); }
        .v6 .copy { border-left:.0625rem dashed var(--accent); padding-left:1rem; }
        .v6 .caption { margin-top:.25rem; }
        .v7 .balance-heading { display:flex; justify-content:space-between; align-items:center; gap:.75rem; margin-bottom:.75rem; }
        .v7 .free-tag { padding:.125rem .625rem; border-radius:1rem; color:var(--accent); background:var(--soft); font-size:.8125rem; font-weight:600; }
        .v7 .balance-value { display:flex; align-items:baseline; gap:.5rem; }
        .v7 .caption:last-child { margin-top:.25rem; }
        .v8 .headline { line-height:1.5; }
        .v8 mark { color:var(--accent); background:var(--soft); border-radius:.375rem; padding:.125rem .375rem; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
        .v8 .caption { margin-top:.5rem; }
        .v9 { display:flex; align-items:center; gap:1rem; }
        .v9 .number { display:grid; place-items:center; width:4.75rem; height:4.75rem; flex-shrink:0; border:.1875rem double var(--accent); border-radius:50%; background:var(--soft); color:var(--accent); }
        .v9 .caption { margin-top:.25rem; }
        .v10 { display:flex; align-items:center; gap:.75rem; }
        .v10 img { width:4.5rem; height:4.5rem; object-fit:contain; flex-shrink:0; }
        .v10 .bubble { background:var(--soft); border-radius:1rem 1rem 1rem .25rem; padding:1rem; }
        .v10 .headline { color:var(--accent); font-size:1.25rem; }
        .v10 .caption { margin-top:.25rem; }
        @media(max-width:40rem) { main { padding:1.5rem 1rem 2rem; } .topbar { padding:1rem; } h1 { font-size:1.875rem; } .tools small { display:none; } .gallery { gap:1.5rem; } .sample { padding:1.5rem; } .top-band { padding:0; } .top-band .email-form { padding:1.5rem; } .v5 { padding:1.25rem 1.5rem; } }
    </style>
</head>
<body>
    <svg class="definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><symbol id="icon-moon" viewBox="0 0 512 512"><path fill="currentColor" d="M239.3 48.7c-107.1 8.5-191.3 98.1-191.3 207.3 0 114.9 93.1 208 208 208 33.3 0 64.7-7.8 92.6-21.7-103.4-23.4-180.6-115.8-180.6-226.3 0-65.8 27.4-125.1 71.3-167.3zM0 256c0-141.4 114.6-256 256-256 19.4 0 38.4 2.2 56.7 6.3 9.9 2.2 17.3 10.5 18.5 20.5s-4 19.8-13.1 24.4c-60.6 30.2-102.1 92.7-102.1 164.8 0 101.6 82.4 184 184 184 5 0 9.9-.2 14.8-.6 10.1-.8 19.6 4.8 23.8 14.1s2 20.1-5.3 27.1C387.3 484.8 324.8 512 256 512 114.6 512 0 397.4 0 256z"/></symbol></defs></svg>
    <header class="topbar">
        <div class="brand">Slax Assistant</div>
        <div class="tools"><small>Design preview · sign-in is inactive</small><button id="theme" class="theme" type="button" aria-label="Switch color theme" title="Switch color theme"><svg aria-hidden="true"><use href="#icon-moon"/></svg></button></div>
    </header>
    <main>
        <div class="intro"><h1>10 ways to offer 100 free credits</h1><p>Each option uses the same email field and sign-in button so you can compare the offer itself</p></div>
        <div id="gallery" class="gallery"></div>
    </main>
    <script>
        'use strict';
        const offers=[
            {name:'Left accent',html:'<div class="v1"><div class="headline">100 free credits</div><small class="caption">when you sign in</small></div>'},
            {name:'Number tile',html:'<div class="v2"><strong class="number">100</strong><div><span class="label">free credits</span><small class="caption">when you sign in</small></div></div>'},
            {name:'Centered welcome',html:'<div class="v3"><small class="caption">Get started with</small><div class="headline"><strong class="number">100</strong>free credits</div><small class="caption">when you sign in</small></div>'},
            {name:'Solid banner',html:'<div class="v4"><strong class="number">100</strong><div><span class="label">free credits</span><small class="caption">when you sign in</small></div></div>'},
            {name:'Full-width card header',className:'top-band',html:'<div class="v5"><strong class="number">100</strong><div><span class="label">free credits</span><small class="caption">when you sign in</small></div></div>'},
            {name:'Welcome ticket',html:'<div class="v6"><strong class="number">100</strong><div class="copy"><span class="label">free credits</span><small class="caption">when you sign in</small></div></div>'},
            {name:'Starting balance',html:'<div class="v7"><div class="balance-heading"><small class="caption">Your starting balance</small><span class="free-tag">Free</span></div><div class="balance-value"><strong class="number">100</strong><span class="label">credits</span></div><small class="caption">when you sign in</small></div>'},
            {name:'Inline highlight',html:'<div class="v8"><div class="headline">Start with<br><mark>100 free credits</mark></div><small class="caption">when you sign in</small></div>'},
            {name:'Round seal',html:'<div class="v9"><strong class="number">100</strong><div><span class="label">free credits</span><small class="caption">when you sign in</small></div></div>'},
            {name:'Assistant welcome',html:'<div class="v10"><img src="../crates/client/web/assistant.png" width="72" height="72" alt="Your Slax Assistant"><div class="bubble"><div class="headline">100 free credits</div><small class="caption">when you sign in</small></div></div>'}
        ];
        // Keep the surrounding form identical across all ten proposals.
        document.getElementById('gallery').innerHTML=offers.map((offer,index)=>'<section class="choice"><h2><span>'+String(index+1).padStart(2,'0')+'</span>'+offer.name+'</h2><div class="sample '+(offer.className || '')+'">'+offer.html+'<form class="email-form"><input type="email" aria-label="Email address" placeholder="you@example.com" autocomplete="off"><button type="button">Sign in with email</button></form></div></section>').join('');
        document.addEventListener('submit',event=>event.preventDefault());
        document.getElementById('theme').addEventListener('click',()=>
        {
            document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
        });
    </script>
</body>
</html>
